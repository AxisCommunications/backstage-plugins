name: Basic workflow

on: [push, pull_request, workflow_dispatch]

# Least-privilege default; jobs only need read access to the repo contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type checking and generate .d.ts files before packaging
        run: yarn tsc

      - name: Build all
        run: yarn build:all

      - name: check api reports
        run: yarn build:api-reports --ci

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

  format:
    name: Formatting and linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: fetch branch main
        run: git fetch origin main

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: yarn install --immutable

      - name: Repo fix
        run: yarn fix --check

      - name: Prettier
        run: yarn prettier:check

      - name: Linting
        run: yarn lint

      - name: lint openapi yaml files
        run: yarn backstage-repo-tools repo schema openapi lint
